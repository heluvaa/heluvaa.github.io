    <text x="84" y="408" font-size="82" fill="url(#g)">Widiansyah</text>
  </g>

  <g font-family="monospace">
    <text x="88" y="472" font-size="25" fill="#00ffa3">SMK TKJ graduate building AI products</text>
  </g>

  <rect x="88" y="512" width="68" height="3" fill="url(#g)"/>

  <g font-family="sans-serif" font-size="21" fill="#7d8494">
