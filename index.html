<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk cURL Extractor (Cookie & Token)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            color: #ffa500;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            margin-top: 5px;
            resize: vertical;
            box-sizing: border-box;
            font-family: monospace;
        }
        .mode-selector {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #btnExtract {
            background-color: #ff8c00;
            color: #000;
        }
        #btnExtract:hover {
            background-color: #e07b00;
        }
        #btnClear {
            background-color: #d9534f;
            color: #fff;
        }
        #btnClear:hover {
            background-color: #c9302c;
        }
        #btnCopy {
            background-color: #4CAF50;
            color: #fff;
            margin-top: 10px;
            width: 100%;
        }
        #btnCopy:hover {
            background-color: #45a049;
        }
        .output-container {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Bulk cURL Extractor (Banyak Sekaligus)</h2>
    
    <label for="curlInput">Tempel (Paste) Banyak cURL di sini (1 cURL per baris / pisah enter):</label>
    <textarea id="curlInput" placeholder="Paste cURL akun 1&#10;Paste cURL akun 2&#10;Paste cURL akun 3..."></textarea>
    
    <div class="mode-selector">
        <label style="margin: 0;">Pilih Mode Ekstrak:</label>
        <label><input type="radio" name="extractMode" value="cookie" checked> Cookie</label>
        <label><input type="radio" name="extractMode" value="token"> Bearer Token</label>
    </div>

    <div class="button-group">
        <button id="btnExtract" onclick="extractBulkData()">Ekstrak Semua</button>
        <button id="btnClear" onclick="clearFields()">Clear</button>
    </div>

    <div class="output-container">
        <label for="dataOutput">Hasil Ekstrak (Tiap baris 1 data):</label>
        <textarea id="dataOutput" readonly placeholder="Hasil banyak data akan muncul di sini..."></textarea>
    </div>
    
    <button id="btnCopy" onclick="copyData()">Copy Semua Hasil</button>

    <script>
        function extractBulkData() {
            const curlText = document.getElementById('curlInput').value;
            const outputBox = document.getElementById('dataOutput');
            const mode = document.querySelector('input[name="extractMode"]:checked').value;

            if (!curlText.trim()) {
                alert('Silakan masukkan teks cURL terlebih dahulu!');
                return;
            }

            // Memisahkan teks berdasarkan baris baru (enter)
            const lines = curlText.split(/\r?\n/);
            let results = [];

            lines.forEach(line => {
                if (!line.trim()) return; // Lewati baris kosong

                if (mode === 'cookie') {
                    const regex = /cookie:\s*['"]?(.*?)['"]?\b/i;
                    let match = line.match(regex);
                    if (!match) {
                        const altRegex = /-H\s+['"].*?cookie:\s*(.*?)['"]/i;
                        match = line.match(altRegex);
                    }
                    if (match && match[1]) {
                        results.push(match[1].trim().replace(/^['"]|['"]$/g, ''));
                    }
                } else if (mode === 'token') {
                    const regex = /Bearer\s+(eyJ[a-zA-Z0-9\-_.]+\.[a-zA-Z0-9\-_.]+\.[a-zA-Z0-9\-_.]+)/i;
                    const match = line.match(regex);
                    if (match && match[1]) {
                        results.push(match[1]);
                    }
                }
            });

            if (results.length > 0) {
                outputBox.value = results.join('\n');
            } else {
                alert('Tidak ada data yang berhasil diekstrak. Pastikan format cURL benar!');
                outputBox.value = '';
            }
        }

        function clearFields() {
            document.getElementById('curlInput').value = '';
            document.getElementById('dataOutput').value = '';
        }

        function copyData() {
            const outputBox = document.getElementById('dataOutput');
            if (!outputBox.value) {
                alert('Tidak ada data yang bisa disalin!');
                return;
            }
            
            outputBox.select();
            outputBox.setSelectionRange(0, 99999);
            
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert('Semua hasil berhasil disalin ke clipboard! Bisa langsung dipaste ke cookie.txt');
            }).catch(err => {
                alert('Gagal menyalin data.');
            });
        }
    </script>

</body>
  </html>
