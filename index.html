<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor Bearer Token cURL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-family: monospace;
            position: relative;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Extractor Bearer Token (eyJ...)</h2>
    <p>Tempel (paste) kode cURL Anda di bawah ini:</p>
    
    <textarea id="curlInput" placeholder="Paste script cURL di sini..."></textarea>
    <button onclick="extractToken()">Ekstrak Token</button>

    <div id="resultContainer" class="result-box hidden">
        <strong>Token Berhasil Diekstrak:</strong>
        <p id="tokenOutput"></p>
        <button onclick="copyToken()" style="background-color: #007bff; margin-top: 5px;">Salin Token</button>
    </div>
</div>

<script>
    function extractToken() {
        const curlText = document.getElementById('curlInput').value;
        
        // Regex untuk mencari pola 'Bearer eyJ...' di dalam string cURL
        const regex = /Bearer\s+(eyJ[a-zA-Z0-9\-_.]+\.[a-zA-Z0-9\-_.]+\.[a-zA-Z0-9\-_.]+)/;
        const match = curlText.match(regex);

        const resultContainer = document.getElementById('resultContainer');
        const tokenOutput = document.getElementById('tokenOutput');

        if (match && match[1]) {
            // Menampilkan token (hanya bagian eyJ... nya saja)
            tokenOutput.textContent = match[1];
            resultContainer.classList.remove('hidden');
        } else {
            alert('Bearer token dengan awalan "eyJ" tidak ditemukan dalam script cURL tersebut!');
            resultContainer.classList.add('hidden');
        }
    }

    function copyToken() {
        const tokenText = document.getElementById('tokenOutput').textContent;
        navigator.clipboard.writeText(tokenText).then(() => {
            alert('Token berhasil disalin ke clipboard!');
        }).catch(err => {
            console.error('Gagal menyalin: ', err);
        });
    }
</script>

</body>
</html>
